<title>ANU Snowsports Bingo</title>
<style>
  :root{
    --night:#0B1F38;
    --deep:#061426;
    --snow:#F7FAFC;
    --gold:#E8B33C;
    --gold-deep:#C98A10;
    --ink:#08192E;
    --pad:10px;
    --gap:6px;
    --cellpad:9px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 70% at 50% -10%, #163458 0%, rgba(22,52,88,0) 60%),
      var(--night);
    color:var(--snow);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;
    overscroll-behavior:none;
    display:flex;
    flex-direction:column;
    min-height:100svh;
    padding:max(8px,env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-right));
  }

  header{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;}
  header img{width:min(62vw,240px);height:auto;display:block;}
  .tagline{font-size:13px;letter-spacing:.02em;color:#9FB8D4;margin:0;}

  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0;}

  .board{
    width:min(100%, calc(100vh - 210px));
    width:min(100%, calc(100svh - 210px));
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:var(--gap);
  }

  .cell{
    position:relative;
    border:0;
    margin:0;
    padding:var(--cellpad);
    border-radius:9px;
    background:var(--snow);
    color:var(--ink);
    font:inherit;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, background-color .12s ease, box-shadow .12s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 6px rgba(0,0,0,.35);
  }
  .cell .txt{
    display:block;
    width:100%;
    line-height:1.08;
    letter-spacing:-.01em;
    overflow-wrap:anywhere;
    hyphens:auto;
  }
  .cell:active{transform:scale(.95);}
  .cell[aria-pressed="true"]{
    background:linear-gradient(180deg,var(--gold) 0%,var(--gold-deep) 100%);
    color:var(--ink);
    box-shadow:0 0 0 2px var(--ink) inset, 0 1px 4px rgba(0,0,0,.4);
  }
  .cell[aria-pressed="true"]::after{
    content:"\2744";
    position:absolute;top:2px;right:4px;
    font-size:9px;opacity:.55;
  }
  .cell.free{background:var(--deep);color:var(--snow);box-shadow:0 0 0 2px var(--gold) inset;}
  .cell.free .txt{font-size:26px !important;}
  .cell.free::after{content:none;}
  .cell.win{
    box-shadow:0 0 0 3px #fff inset, 0 0 14px rgba(255,255,255,.55);
  }
  .cell:focus-visible{outline:3px solid #fff;outline-offset:2px;}

  footer{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:4px;
  }
  .progress{font-size:14px;color:#A9C1DB;margin:0;}
  .progress b{color:var(--snow);font-weight:700;}
  .btn{
    border:2px solid rgba(255,255,255,.35);
    background:transparent;color:var(--snow);
    font:inherit;font-weight:600;font-size:15px;
    padding:11px 16px;border-radius:999px;min-height:44px;
    cursor:pointer;
  }
  .btn:active{transform:scale(.97);}
  .btn.solid{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700;}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:2px;}

  /* win banner */
  .scrim{
    position:fixed;inset:0;z-index:20;
    background:rgba(4,13,25,.86);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .scrim.show{display:flex;}
  .panel{
    position:relative;z-index:2;
    width:min(100%,420px);
    text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .shout{
    margin:0;
    font-size:clamp(52px,17vw,96px);
    font-weight:900;
    letter-spacing:.02em;
    color:transparent;
    -webkit-text-stroke:3px var(--snow);
    text-stroke:3px var(--snow);
  }
  .shout span{-webkit-text-stroke-color:var(--gold);}
  .line-name{margin:0 0 14px;font-size:17px;color:#CBDCEE;}
  .panel .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  .flake{position:absolute;top:-6vh;color:#fff;opacity:.85;animation:fall linear forwards;z-index:1;pointer-events:none;}
  @keyframes fall{to{transform:translateY(115vh) rotate(220deg);opacity:.15;}}

  @media (prefers-reduced-motion:reduce){
    .flake{display:none;}
    .cell,.btn{transition:none;}
  }
  @media (max-width:360px){
    :root{--cellpad:6px;}
  }
  @media (min-width:560px){
    :root{--gap:9px;--cellpad:12px;}
    .cell{border-radius:12px;}
    .board{width:min(100%,520px);}
  }
</style>
</head>

  <p class="tagline">Snow trip bingo — tap what you complete</p>
</header>

<main>
  <div class="board" id="board" role="grid" aria-label="Bingo card"></div>
</main>

<footer>
  <p class="progress"><b id="count">0</b> of 25 marked<span id="wins"></span></p>
  <button class="btn" id="newCard" type="button">New card</button>
</footer>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="shout">
  <div class="panel">
    <p class="shout" id="shout">BIN<span>GO</span></p>
    <p class="line-name" id="lineName">Top row, complete.</p>
    <div class="row">
      <button class="btn solid" id="keepPlaying" type="button">Keep playing</button>
      <button class="btn" id="newCard2" type="button">New card</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   1. SQUARES — replace this list with your own.
   Put as many as you like. 25 or more means every card is shuffled
   and slightly different; exactly 24 (with FREE_SPACE on) or 25
   (with it off) means every card has the same squares in a new order.
------------------------------------------------------------------ */
const SQUARES = [
  // Row 1
  "Jump in the lake",
  "Buy an exec a drink",
  "Shoey at the pub",
  "Wax somewhere you haven't before",
  "4 tin, tin a lift",
  // Row 2
  "Get a stranger's phone number on your arm",
  "Get walked around on a leash",
  "Shower beer (must scull)",
  "Do a ski run in your undies",
  "Have an Appy on the mountain",
  // Row 3
  "2 before 9 or 9 before 2",
  "Outscull someone",
  "Get in the tub",
  "Scull a tin whilst skiing down a run",
  "Piss off the summit",
  // Row 4
  "Scull a pint in 1 go",
  "Finish a bottle of wine with mates",
  "Split the G",
  "Rock a sharpie moustache and glasses",
  "Finish an entire drink without your hands or straws",
  // Row 5
  "Swap a piece of clothing with a stranger",
  "Write RIVET across your ass (crack is the I)",
  "Walrus (two schooners, straw in each, cannot leave mouth or glass)",
  "Wear your clothes backwards for the night",
  "Beereal (full beer in cereal)"
];

/* Positions: SHUFFLE = true gives everyone a differently arranged card.
   Set it to false to lock the squares exactly in the order listed above,
   read left to right, top to bottom. */
const SHUFFLE = false;

const FREE_SPACE = false;         // centre square is a challenge like any other
const FREE_LABEL = "\u2744";
const KEY = "anu-snowsports-bingo-v3";

/* ---------- storage that degrades gracefully ---------- */
const store = (() => {
  let ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  let mem = null;
  return {
    read(){
      try { return ok ? JSON.parse(localStorage.getItem(KEY)) : mem; }
      catch(e){ return null; }
    },
    write(v){
      mem = v;
      try { if(ok) localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){}
    }
  };
})();

const board = document.getElementById("board");
const countEl = document.getElementById("count");
const winsEl = document.getElementById("wins");
const scrim = document.getElementById("scrim");
const lineName = document.getElementById("lineName");

let card = [];            // 25 strings
let marked = [];          // 25 booleans
let celebrated = [];      // line keys already shown

/* ---------- lines ---------- */
const LINES = [];
for (let r = 0; r < 5; r++) LINES.push({ name: ["Top row","Second row","Middle row","Fourth row","Bottom row"][r], idx: [0,1,2,3,4].map(c => r*5+c) });
for (let c = 0; c < 5; c++) LINES.push({ name: ["First column","Second column","Middle column","Fourth column","Last column"][c], idx: [0,1,2,3,4].map(r => r*5+c) });
LINES.push({ name: "Diagonal", idx: [0,6,12,18,24] });
LINES.push({ name: "Diagonal", idx: [4,8,12,16,20] });

/* ---------- build a card ---------- */
function shuffle(a){
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function makeCard(){
  const need = FREE_SPACE ? 24 : 25;
  let pool = SHUFFLE ? shuffle(SQUARES) : SQUARES.slice();
  while (pool.length < need) pool = pool.concat(shuffle(SQUARES));
  pool = pool.slice(0, need);
  if (FREE_SPACE) pool.splice(12, 0, FREE_LABEL);
  return pool;
}

function freshState(){
  card = makeCard();
  marked = card.map((_, i) => FREE_SPACE && i === 12);
  celebrated = [];
  save();
  render();
}

function save(){ store.write({ card, marked, celebrated }); }

/* ---------- render ---------- */
function render(){
  board.innerHTML = "";
  card.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell" + (FREE_SPACE && i === 12 ? " free" : "");
    b.setAttribute("aria-pressed", marked[i] ? "true" : "false");
    b.setAttribute("aria-label", (FREE_SPACE && i === 12) ? "Free square" : text);
    const s = document.createElement("span");
    s.className = "txt";
    s.textContent = text;
    b.appendChild(s);
    if (!(FREE_SPACE && i === 12)) b.addEventListener("click", () => toggle(i));
    board.appendChild(b);
  });
  fitAll();
  update();
}

function toggle(i){
  marked[i] = !marked[i];
  const b = board.children[i];
  b.setAttribute("aria-pressed", marked[i] ? "true" : "false");
  if (navigator.vibrate) navigator.vibrate(8);
  save();
  update();
}

/* ---------- fit text to each square ---------- */
function fitAll(){
  Array.from(board.children).forEach(cell => {
    const span = cell.querySelector(".txt");
    if (cell.classList.contains("free")) return;
    const pad = parseFloat(getComputedStyle(cell).paddingTop) * 2;
    const availH = cell.clientHeight - pad;
    const availW = cell.clientWidth - pad;
    if (availH <= 0) return;
    let size = Math.max(9, Math.min(20, cell.clientHeight * 0.27));
    span.style.fontSize = size + "px";
    let guard = 40;
    while (size > 6.5 && guard-- > 0 &&
          (span.scrollHeight > availH || span.scrollWidth > availW)){
      size -= 0.5;
      span.style.fontSize = size + "px";
    }
  });
}

/* ---------- wins ---------- */
function update(){
  const n = marked.filter(Boolean).length;
  countEl.textContent = n;

  const done = [];
  LINES.forEach((L, k) => { if (L.idx.every(i => marked[i])) done.push(k); });

  Array.from(board.children).forEach(c => c.classList.remove("win"));
  done.forEach(k => LINES[k].idx.forEach(i => board.children[i].classList.add("win")));

  winsEl.textContent = done.length ? "  \u00B7  " + done.length + (done.length === 1 ? " line" : " lines") : "";

  const fresh = done.filter(k => !celebrated.includes(k));
  if (fresh.length){
    celebrated = celebrated.concat(fresh);
    save();
    celebrate(LINES[fresh[0]].name);
  } else {
    celebrated = celebrated.filter(k => done.includes(k));
    save();
  }
}

function celebrate(name){
  lineName.textContent = name + ", complete.";
  scrim.classList.add("show");
  if (navigator.vibrate) navigator.vibrate([25, 60, 25, 60, 120]);
  snow();
}

function snow(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 26; i++){
    const f = document.createElement("div");
    f.className = "flake";
    f.textContent = "\u2744";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = (10 + Math.random() * 20) + "px";
    f.style.animationDuration = (2.6 + Math.random() * 2.6) + "s";
    f.style.animationDelay = (Math.random() * 1.2) + "s";
    scrim.appendChild(f);
    setTimeout(() => f.remove(), 7000);
  }
}

/* ---------- controls ---------- */
function newCard(){
  const n = marked.filter(Boolean).length - (FREE_SPACE ? 1 : 0);
  const verb = SHUFFLE ? "Start a new card? " : "Clear the card? ";
  if (n > 0 && !confirm(verb + "This unmarks " + n + " " + (n === 1 ? "square" : "squares") + ".")) return;
  scrim.classList.remove("show");
  freshState();
}
if (!SHUFFLE){
  document.getElementById("newCard").textContent = "Clear card";
  document.getElementById("newCard2").textContent = "Clear card";
}
document.getElementById("newCard").addEventListener("click", newCard);
document.getElementById("newCard2").addEventListener("click", newCard);
document.getElementById("keepPlaying").addEventListener("click", () => scrim.classList.remove("show"));
scrim.addEventListener("click", e => { if (e.target === scrim) scrim.classList.remove("show"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") scrim.classList.remove("show"); });

/* ---------- boot ---------- */
const saved = store.read();
if (saved && Array.isArray(saved.card) && saved.card.length === 25 && Array.isArray(saved.marked)){
  card = saved.card;
  marked = saved.marked;
  celebrated = Array.isArray(saved.celebrated) ? saved.celebrated : [];
  render();
} else {
  freshState();
}

let t;
const refit = () => { clearTimeout(t); t = setTimeout(fitAll, 120); };
window.addEventListener("resize", refit);
